<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Committee | HIS Global Conclave</title>
<style>
  :root{--bg:#030303;--ink:#f4f1ec;--sand:#b9a48c;--dim:#8a7b6a;--line:rgba(185,164,140,.4);--gold:#e4b783;--blue:#1b9be0;
    --mono:"Consolas","Courier New",monospace;--grid:rgba(255,255,255,.035)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;color:var(--ink);font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;
    background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/100% 120px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/120px 100%,
      radial-gradient(ellipse at 50% 40%,rgba(60,50,35,.25),transparent 65%),var(--bg);overflow-x:hidden}
  .label{font:12px var(--mono);letter-spacing:.3em;color:var(--sand);text-transform:uppercase}
  .corner{position:fixed;width:26px;height:26px;border:1px solid rgba(185,164,140,.35);pointer-events:none}
  .corner.tr{top:44px;right:34px}.corner.bl{bottom:18px;left:18px}.corner.br{bottom:18px;right:34px}

  .page{display:grid;grid-template-columns:minmax(200px,1fr) minmax(300px,2fr) minmax(200px,1fr);gap:32px;padding:44px 40px 70px;max-width:1280px;margin:0 auto}
  .col{display:flex;flex-direction:column}
  .center{align-items:center;text-align:center}

  .back{align-self:flex-start;display:inline-flex;gap:12px;align-items:center;padding:10px 16px;border:1px solid var(--line);border-radius:4px;
    font:12px var(--mono);letter-spacing:.25em;color:var(--sand);text-decoration:none;text-transform:uppercase;transition:background .2s,color .2s}
  .back:hover,.back:focus-visible{background:var(--sand);color:#050505;outline:none}

  .emblem{width:136px;height:136px;margin:48px auto 0;border-radius:50%;padding:3px;border:2px solid #d9c6ad;background:#06121c;position:relative;
    box-shadow:0 0 0 3px #000,0 0 28px rgba(228,183,131,.18)}
  .emblem svg,.emblem img{width:100%;height:100%;display:block;border-radius:50%}
  .emblem img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:contain;padding:12%;background:radial-gradient(circle at 50% 30%,#fffdf8,#e6ddcf)}
  .cname{margin:26px 0 0;text-align:center}
  .full{margin-top:8px;text-align:center;font-weight:300;font-size:.9rem;color:var(--dim)}

  .agenda{margin-top:56px}
  .agenda .label{font-size:11px;letter-spacing:.25em;color:var(--dim)}
  .topic{margin-top:22px;font-size:.84rem;line-height:1.55;font-weight:300}
  .topic b{display:block;font-weight:400;color:var(--ink)}

  .viewer{position:relative;width:min(100%,340px);height:470px;margin-top:26px;background:#141414;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
  .viewer p{padding:24px;font-size:.82rem;line-height:1.6;color:var(--dim);font-weight:300}
  .viewer iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#2b2b2b}
  .open{position:absolute;top:8px;right:8px;z-index:2;width:30px;height:30px;display:grid;place-items:center;background:rgba(0,0,0,.65);color:#fff;border-radius:4px;text-decoration:none}
  .open svg{width:16px;height:16px}
  .cta{margin-top:34px;display:inline-block;padding:11px 28px;border:1px solid rgba(185,164,140,.45);border-radius:999px;font:12px var(--mono);letter-spacing:.22em;
    text-transform:uppercase;text-decoration:none;color:var(--gold);background:rgba(255,255,255,.03);transition:background .2s,color .2s}
  .cta:hover,.cta:focus-visible{background:var(--gold);color:#050505;outline:none}

  .board{display:flex;flex-direction:column;gap:30px;margin-top:34px;align-items:flex-start}
  .member{width:134px;text-align:center}
  .photo{position:relative;width:134px;height:134px;border-radius:6px;overflow:hidden;background:#101820;border:1px solid rgba(185,164,140,.25);}
  .photo svg{position:absolute;inset:0;width:100%;height:100%}
  .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .role{margin-top:12px;font-size:.78rem;font-weight:600}
  .pos{margin-top:3px;font-size:.68rem;font-weight:400;color:var(--dim)}

  .switch{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:36px}
  .switch a{padding:6px 12px;border:1px solid rgba(185,164,140,.25);border-radius:999px;font:11px var(--mono);letter-spacing:.15em;color:var(--dim);text-decoration:none;transition:all .2s}
  .switch a:hover,.switch a.on{color:#050505;background:var(--sand);border-color:var(--sand)}

  @media (prefers-reduced-motion:no-preference){.col{animation:in .7s cubic-bezier(.2,.8,.3,1) both}.col:nth-child(2){animation-delay:.1s}.col:nth-child(3){animation-delay:.2s}
    @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}}
  @media (max-width:900px){.page{grid-template-columns:1fr;padding:24px 20px 60px}.col{align-items:center}.back{align-self:flex-start}
    .agenda{margin-top:34px;width:100%;max-width:340px}.board{flex-direction:row;flex-wrap:wrap;justify-content:center}.corner{display:none}}
</style>
</head>

    return '<div class="member"><div class="photo"><svg><use href="#person"/></svg><img src="'+(PH[i]||'board/'+k+'-'+(i+1)+'.jpg')+'" alt="'+NAMES[i]+'" onerror="this.remove()"></div><div class="role">'+NAMES[i]+'</div><div class="pos">'+r+'</div></div>'
  }).join("");
  $("switch").innerHTML=Object.keys(C).map(function(x){return '<a href="'+x+'.html"'+(x===k?' class="on"':'')+'>'+C[x].n+'</a>'}).join("");
}
window.addEventListener("hashchange",render);render();
</script>
