<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIS Global Conclave Edition 3 | Model United Nations</title>
<style>
  :root{
    --top:#1e4a87; --mid:#2f78b8; --bot:#52d3d9;
    --card-top:#2a63ae; --card-bot:#52d3d9;
    --ink:#fff; --ink-dim:rgba(255,255,255,.72);
    --row:rgba(255,255,255,.08); --row-hover:rgba(255,255,255,.2);
    --btn:rgba(15,40,80,.55);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:"DM Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--ink);
    background:linear-gradient(180deg,var(--top) 0%,var(--mid) 45%,var(--bot) 100%) fixed;
    display:flex;justify-content:center;transition:background .4s;
  }
  .card{
    width:100%;max-width:440px;min-height:100vh;padding:20px 16px 18px;position:relative;
    background:linear-gradient(180deg,var(--card-top),var(--card-bot));
    display:flex;flex-direction:column;align-items:center;
    box-shadow:0 0 60px rgba(0,0,0,.25);transition:background .4s;
  }
  @media (min-width:480px){.card{margin-top:28px;border-radius:22px 22px 0 0;min-height:calc(100vh - 28px)}}

  .ibtn{
    position:absolute;top:18px;width:38px;height:38px;border-radius:12px;border:0;cursor:pointer;
    background:var(--btn);color:#fff;display:grid;place-items:center;transition:transform .2s,background .2s
  }
  .ibtn:hover{transform:scale(1.08)}
  .ibtn:focus-visible,.row:focus-visible,.ig:focus-visible{outline:2px solid #fff;outline-offset:3px}
  .ibtn svg{width:18px;height:18px}


  .avatar{width:76px;height:76px;margin-top:34px;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,.9);background:#fff;display:grid;place-items:center}
  .avatar img{width:100%;height:100%;object-fit:cover}
  h1{margin-top:12px;font-size:1.05rem;font-weight:700;letter-spacing:.01em}
  .ig{margin-top:12px;color:#fff;display:grid;place-items:center;transition:transform .2s}
  .ig:hover{transform:scale(1.15) rotate(-6deg)}
  .ig svg{width:22px;height:22px}

  .links{width:100%;margin-top:26px;display:flex;flex-direction:column;gap:12px}
  .section{margin:12px 0 -2px;text-align:center;font-size:.82rem;font-weight:700}
  .row{
    position:relative;display:flex;align-items:center;justify-content:center;min-height:50px;padding:8px 46px;
    border:1.5px solid #fff;border-radius:999px;background:var(--row);color:#fff;text-decoration:none;text-align:center;
    transition:transform .2s,background .2s
  }
  .row:hover{background:var(--row-hover);transform:translateY(-2px) scale(1.012)}
  .row:active{transform:scale(.985)}
  .row b{display:block;font-size:.82rem;font-weight:700}
  .row small{display:block;margin-top:2px;font-size:.66rem;color:var(--ink-dim)}
  .thumb{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:#fff;color:#2a63ae;display:grid;place-items:center}
  .thumb svg{width:20px;height:20px}
  .dots{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:50%;background:none;color:#fff;cursor:pointer;display:grid;place-items:center}
  .dots:hover{background:rgba(255,255,255,.18)}
  .dots svg{width:16px;height:16px}

  footer{margin-top:auto;padding-top:48px;text-align:center;font-size:.64rem;line-height:1.9}
  footer a{color:#fff;text-decoration:none;font-weight:600}
  footer a:hover{text-decoration:underline}
  footer i{font-style:normal;margin:0 4px;opacity:.7}

  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);padding:10px 18px;border-radius:999px;background:rgba(10,20,40,.92);color:#fff;font-size:.8rem;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (prefers-reduced-motion:no-preference){
    .avatar,.links>*,h1,.ig{animation:rise .6s cubic-bezier(.2,.8,.3,1) both}
    h1{animation-delay:.08s}.ig{animation-delay:.14s}
    .links>:nth-child(1){animation-delay:.2s}.links>:nth-child(2){animation-delay:.27s}.links>:nth-child(3){animation-delay:.34s}
    .links>:nth-child(4){animation-delay:.41s}.links>:nth-child(5){animation-delay:.48s}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
<main class="card">

  <button class="ibtn" id="share" aria-label="Share this page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l8 8h-3v8H7v-8H4z"/></svg>
  </button>

  <div class="avatar">
    <img src="hisk.logo.png" alt="HIS Global Conclave logo" onerror="this.remove()">
  </div>
  <h1>@hisglobalconclave</h1>
  <a class="ig" href="https://www.instagram.com/hisglobalconclave" target="_blank" rel="noopener" aria-label="Instagram">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>
  </a>

  <nav class="links">
    <a class="row" href="https://www.instagram.com/reel/DCrPtfVSRZH/?utm_source=ig_web_copy_link" target="_blank" rel="noopener">
      <b>Glimpses of HIS GLOBAL CONCLAVE: EDITION 2</b>
      <button class="dots" aria-label="Copy link"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
    </a>
    <a class="row" href="index.html" target="_blank" rel="noopener">
      <b>Registration and Background Guide</b>
      <button class="dots" aria-label="Copy link"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
    </a>
    <a class="row" href="#brochure" target="_blank" rel="noopener">
      <span class="thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg></span>
      <span><b>Brochure</b><small>PDF · 4 pages</small></span>
      <button class="dots" aria-label="Copy link"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
    </a>

    <h2 class="section">Poster</h2>
    <a class="row" href="#poster" target="_blank" rel="noopener">
      <span class="thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 17l-5-5-9 8"/></svg></span>
      <span><b>Poster</b><small>Gallery · 1 photo</small></span>
      <button class="dots" aria-label="Copy link"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
    </a>
  </nav>

  
</main>
<div class="toast" id="toast" role="status">Link copied</div>

<script>
var root=document.documentElement,toast=document.getElementById("toast"),t;
function say(m){toast.textContent=m;toast.classList.add("show");clearTimeout(t);t=setTimeout(function(){toast.classList.remove("show")},1800)}
function copy(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){say("Link copied")},function(){say("Couldn’t copy")})}
  else say("Couldn’t copy")
}
};
document.getElementById("share").onclick=function(){
  if(navigator.share){navigator.share({title:document.title,url:location.href}).catch(function(){})}else copy(location.href)
};
document.querySelectorAll(".dots").forEach(function(b){
  b.addEventListener("click",function(e){
    e.preventDefault();e.stopPropagation();
    copy(new URL(b.closest(".row").getAttribute("href"),location.href).href)
  });
});
</script>
</body>
</html>
